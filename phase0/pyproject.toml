[project]
name = "splat2d-phase0"
version = "0.0.1"
description = "Phase 0: 2D Gaussian fitter with per-pixel and per-splat custom backward passes"
requires-python = ">=3.10"
dependencies = ["torch"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["csrc"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["splat2d", "conftest"]

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "tests/gradcheck"
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
